name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --quiet
      - name: Full gate (lint -> lint-battery -> typecheck -> test -> coverage)
        run: make check
