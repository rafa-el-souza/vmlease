[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmlease"
version = "0.1.0"
description = "Provision throwaway cloud VMs, run a workload over SSH, and always tear them down — a project-agnostic VM-provisioning + probe harness."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafa Souza", email = "45876673+rafa-el-souza@users.noreply.github.com" }]
keywords = ["hetzner", "provisioning", "vm", "ssh", "cloud-init", "throwaway", "probe"]
dependencies = ["google-re2>=1.1"]

[project.scripts]
vmlease = "vmlease.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "coverage>=7.6", "pre-commit>=3.8"]

[tool.uv]
# Wheels-only for google-re2: never fall back to a source build for this dep.
# google-re2 publishes no musllinux wheels, so on an unsupported platform
# (musl/Alpine) `uv sync` fails LOUD here rather than silently compiling a
# divergent/ABI-skewed RE2+Abseil binary from sdist. The supported matrix is
# glibc-Linux / macOS / Windows (D6). Scoped to the package (not global
# `no-build`) so the editable root project still installs from source.
no-build-package = ["google-re2"]

[tool.hatch.build.targets.wheel]
packages = ["src/vmlease"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Strict, correctness-broad ruleset: pyflakes (F), pycodestyle errors+warnings
# (E4/E7/E9/W), import sorting (I), bugbear (B), pyupgrade (UP), simplify (SIM),
# comprehensions (C4), Ruff-native (RUF), flake8-pie (PIE). E501 (line length) is
# deliberately NOT enforced — distro.py carries intentionally-unwrapped
# shell-command string literals; restructuring them would risk the rendered script.
select = ["E4", "E7", "E9", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PIE"]

[tool.ruff.format]
# `ruff format` is BANNED in this project (it has a code-mangling bug). This
# excludes every file from the formatter, so an accidental `ruff format` is a
# no-op. Formatting/auto-fixes go through `ruff check --fix` (see `make format`).
exclude = ["*"]

[tool.mypy]
python_version = "3.11"
# `google-re2` ships no type info; `stubs/re2.pyi` declares the surface we use.
mypy_path = "stubs"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["vmlease"]
branch = true

[tool.coverage.report]
# Floor just below the natural coverage (measured 96%); the only uncovered lines
# are the injected live default seams (real subprocess/urllib/ssh I/O) — honestly
# reported, never pragma'd or omitted.
fail_under = 95
show_missing = true
