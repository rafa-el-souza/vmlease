name = "vmlease-compose-plugin-check"

# A read-only, no-upload smoke that a freshly-provisioned VM has the docker
# prerequisites vmlease's cloud-init installs: Docker, the `docker compose` v2
# plugin, buildx, and `script(1)`. Guards vmlease's per-distro install template
# against regressions. All probes are read-only (no host mutation beyond /tmp),
# so authoring order already matches the former tag-rank execution order.

[[probe]]
id = "COMPOSE"
title = "Prove the vmlease docker-compose-plugin fix: a freshly-provisioned host has a working `docker compose` (incl. the exact `docker compose -f` that failed on debian-13)"
tag = "read-only"
classifies = "Proves vmlease's install-template fix (docker-compose-plugin added to apt/dnf; docker-compose for arch): a freshly-provisioned host has a working compose-v2 plugin. `docker compose version` exit 0; `docker compose -f <file> config` exit 0 (the exact form that died with 'unknown shorthand flag: f' on debian-13 pre-fix); and the pre-fix error strings are absent. read-only (no host mutation beyond /tmp)."
run = '''
rc=0
. /etc/os-release
echo "distro: $PRETTY_NAME"
echo "docker client: $(docker version --format '{{.Client.Version}}' 2>&1)"

echo '== docker compose version (the plugin must be installed) =='
docker compose version > /tmp/cv.out 2>&1
CV=$?
cat /tmp/cv.out
if [ "$CV" -eq 0 ]; then echo COMPOSE_PLUGIN_PRESENT_OK; else echo COMPOSE_PLUGIN_MISSING_FAIL; rc=1; fi

echo '== compose plugin on disk =='
ls -la "$HOME/.docker/cli-plugins/" /usr/libexec/docker/cli-plugins/ /usr/lib/docker/cli-plugins/ /usr/local/lib/docker/cli-plugins/ 2>/dev/null | grep -i compose || echo 'none in standard dirs (plugin may be vendored in the docker pkg)'

echo '== the EXACT previously-failing invocation: docker compose -f <file> config =='
printf 'services:\n  hello:\n    image: busybox:latest\n    command: ["true"]\n' > /tmp/dc.yml
docker compose -f /tmp/dc.yml config > /tmp/cfg.out 2>&1
CFG=$?
echo "docker compose -f ... config exit: $CFG"
head -8 /tmp/cfg.out
if [ "$CFG" -eq 0 ]; then echo COMPOSE_DASH_F_OK; else echo COMPOSE_DASH_F_FAIL; rc=1; fi

echo '== regression guard: the pre-fix error must be ABSENT =='
if grep -qiE "unknown shorthand flag: 'f'|unknown command: docker compose" /tmp/cfg.out /tmp/cv.out; then
  echo COMPOSE_PREFIX_ERROR_PRESENT_FAIL
  rc=1
else
  echo COMPOSE_NO_PREFIX_ERROR_OK
fi

echo '== docker buildx plugin (needed for compose --build; debian-13 lacked it) =='
if docker buildx version > /tmp/bx.out 2>&1; then echo BUILDX_PLUGIN_PRESENT_OK; else echo BUILDX_PLUGIN_MISSING_FAIL; rc=1; cat /tmp/bx.out; fi

echo '== script(1) test tool (fedora splits it into util-linux-script) =='
if command -v script >/dev/null 2>&1; then script --version 2>&1 | head -1; echo SCRIPT_TOOL_PRESENT_OK; else echo SCRIPT_TOOL_MISSING_FAIL; rc=1; fi

exit $rc
'''
